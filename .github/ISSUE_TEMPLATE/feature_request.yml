name: Feature request
description: Suggest an improvement for ff400ctl / FFTray
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like ff400ctl to do
    validations:
      required: true
  - type: textarea
    id: totalmix
    attributes:
      label: TotalMix equivalent
      description: If TotalMix has this feature, where does it live / how does it behave?
