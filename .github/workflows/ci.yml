name: CI

on:
  push:
    branches: [main]
    tags: ['v*']          # path filters are not evaluated for tag pushes
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all targets
        run: swift build

      - name: Unit tests (fftests)
        run: swift run fftests

      - name: Release build + ad-hoc sign (same as Makefile)
        run: |
          swift build -c release --product ffctl
          swift build -c release --product FFTray
          codesign -s - --force --entitlements Resources/entitlements.plist .build/release/ffctl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    needs: build-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build universal DMG
        run: make dmg VER=${GITHUB_REF_NAME#v}

      - name: Attach DMG to release (create if needed)
        run: |
          gh release upload "$GITHUB_REF_NAME" "ff400ctl-${GITHUB_REF_NAME#v}.dmg" --clobber \
            || gh release create "$GITHUB_REF_NAME" "ff400ctl-${GITHUB_REF_NAME#v}.dmg" \
               --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
